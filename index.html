<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a171e;--card:#0f222b;--card2:#132b36;--line:#1f3b48;--text:#e4f0f4;--muted:#87a1aa;--accent:#2bb0c8;--red:#f0606a;--gold:#e8c35a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}
h1,h2,.big,.tab{font-family:Unbounded,Inter,sans-serif}
h1{font-size:22px;margin:0}
h2{font-size:14px;margin:0 0 14px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
a{color:var(--accent);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tab{font-size:12px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.tab.on{background:var(--accent);color:#06222a;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.muted{color:var(--muted)}.neg{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{font:600 13px Inter,sans-serif;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#06222a}
.btn.sm{padding:5px 10px;font-size:12px}.btn.del{color:var(--red);border-color:#5a2a30}
.wallet{background:var(--card2);border-radius:14px;padding:16px;margin-bottom:12px;border-left:4px solid var(--accent)}
.wallet.dev{border-left-color:var(--gold)}
.tag{font:700 11px Unbounded,sans-serif;padding:3px 9px;border-radius:999px;background:#1d4652;color:var(--accent)}
.wallet.dev .tag{background:#4a3d16;color:var(--gold)}
.big{font-size:22px}
.buy{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 4px}
.buy div span{display:block;font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:70px 80px 1fr 110px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #1c3844;font-size:14px}
.steps .t{font-family:Unbounded,sans-serif;font-size:13px}
.bar{height:8px;background:#0a1a21;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--gold);border-radius:99px}
.total{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 16px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.strat{list-style:none;margin:0;padding:0}
.strat li{padding:9px 0 9px 22px;border-top:1px solid #1c3844;position:relative}
.strat li:first-child{border-top:0}
.strat li:before{content:'';position:absolute;left:4px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.strat li b{font-weight:600}
input,textarea{font:14px Inter,sans-serif;background:#0a1a21;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.fields{grid-template-columns:1fr 1fr}.steps li{grid-template-columns:56px 70px 1fr}.steps li .h{display:none}}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:640px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#06222a;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:30}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Dev Lab</h1><nav id="tabs"></nav></div>
  <div id="app"></div>
</div>
<script>
const KEY='devlab.v3';
const uid=()=>Math.random().toString(36).slice(2,10);
const isNum=n=>typeof n==='number'&&isFinite(n);
const num=v=>(v===''||v==null)?null:(isFinite(Number(v))?Number(v):null);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(n,d=2)=>isNum(n)?n.toFixed(d):'—';
const sec=n=>isNum(n)?'~'+Math.round(n)+'s':'?s';
function fmtK(n){if(!isNum(n))return '—';if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return '$'+(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return '$'+Math.round(n)}

function seed(){
  return {devs:[{id:uid(),name:'petal',wallet:'4HXb7…vEpU',
    devBuy:5.00,devPct:15.3,sells:[{sec:null,pct:5.0},{sec:null,pct:3.4}],
    clCount:5,clSol:8.90,clPct:18.6,clExit:null,openMcap:6200,
    notes:'Dev wallet is the earner: 93% win rate, green every day in October\nSide wallets are close to a coin flip (~43–49% win rate), red every day since Oct 9 apart from one\nAbout 30 launches a day, mostly pet and animal names (some Chinese)\nNo one holds for runners: everything is sold in the first wave'}]};
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Could not save in this browser')}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const getDev=id=>DB.devs.find(d=>d.id===id);
const val=id=>document.getElementById(id).value;

function strategy(d){
  const s=[],st=d.sells||[];
  if(isNum(d.devBuy))s.push(`<b>Dev buy:</b> ${f(d.devBuy)} SOL → ${f(d.devPct,1)}% of supply`);
  if(isNum(d.clSol))s.push(`<b>Side wallets:</b> ${f(d.clCount,0)} wallets, ${f(d.clSol)} SOL combined → ${f(d.clPct,1)}% of supply`);
  if(isNum(d.devBuy))s.push(`<b>Opening total:</b> ${f((d.devBuy||0)+(d.clSol||0))} SOL · ${f((d.devPct||0)+(d.clPct||0),1)}% of supply`+(isNum(d.openMcap)?` · mcap ~${fmtK(d.openMcap)} after`:''));
  if(st.length)s.push(`<b>First dev sell:</b> ${sec(st[0].sec)} in · −${f(st[0].pct,1)}% of supply`);
  if(st.length>1)s.push(`<b>Then:</b> `+st.slice(1).map(x=>`−${f(x.pct,1)}% at ${sec(x.sec)}`).join(', '));
  if(st.length&&isNum(d.devPct)){const sold=st.reduce((a,x)=>a+(x.pct||0),0);if(sold>=d.devPct-0.3)s.push(`<b>Dev fully out:</b> ${sec(st[st.length-1].sec)}`)}
  if(isNum(d.clExit))s.push(`<b>Side wallets out:</b> ${sec(d.clExit)}`);
  (d.notes||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>s.push(esc(x)));
  return s.length?`<ul class="strat">${s.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<div class="muted">Hit Edit to fill in his strategy.</div>';
}

function nav(){
  const h=location.hash||'#/';
  document.getElementById('tabs').innerHTML=[['#/','Devs'],['#/backup','Backup']].map(([k,v])=>`<a class="tab ${(h===k||(k==='#/'&&h.startsWith('#/dev/')))?'on':''}" href="${k}">${v}</a>`).join('');
}
function render(){
  nav();const h=location.hash||'#/';const app=document.getElementById('app');
  if(h.startsWith('#/dev/')){const d=getDev(h.slice(6));if(!d){location.hash='#/';return}app.innerHTML=devView(d);return}
  if(h==='#/backup'){app.innerHTML=backupView();return}
  app.innerHTML=homeView();
}
window.addEventListener('hashchange',render);

function homeView(){
  return `<div class="row between" style="margin-bottom:14px"><span class="muted">${DB.devs.length} dev${DB.devs.length===1?'':'s'}</span><button class="btn pri" onclick="editDev()">+ Add dev</button></div>`+
  (DB.devs.map(d=>`<a class="card" style="display:block;color:inherit" href="#/dev/${d.id}">
    <div class="row between"><b style="font-family:Unbounded;font-size:17px">${esc(d.name)}</b><span class="muted" style="font-size:12px">${esc(d.wallet)}</span></div>
    <div class="buy"><div><span>Dev buy</span>${f(d.devBuy)} SOL · ${f(d.devPct,1)}%</div><div><span>Side wallets</span>${f(d.clSol)} SOL · ${f(d.clPct,1)}%</div></div></a>`).join('')||'<div class="card muted">No devs yet.</div>');
}

function devView(d){
  let hold=d.devPct;
  const steps=(d.sells||[]).map(x=>{hold=isNum(hold)?Math.max(0,hold-(x.pct||0)):null;const w=isNum(hold)&&d.devPct?hold/d.devPct*100:0;
    return `<li><span class="t">${sec(x.sec)}</span><span class="neg">−${f(x.pct,1)}%</span><div class="bar"><div style="width:${w}%"></div></div><span class="muted h">holding ${f(hold,1)}%</span></li>`}).join('');
  return `<div class="row between" style="margin-bottom:16px"><div><a href="#/" class="muted" style="font-size:13px">← All devs</a><h1 style="margin-top:4px">${esc(d.name)}</h1></div>
    <button class="btn pri" onclick="editDev('${d.id}')">Edit</button></div>

  <div class="card"><h2>How he buys & sells</h2>
    <div class="wallet dev"><div class="row"><span class="tag">DEV</span><span class="muted" style="font-size:13px">${esc(d.wallet)}</span></div>
      <div class="buy"><div><span>Buys</span><b class="big">${f(d.devBuy)}</b> SOL</div><div><span>Gets</span><b class="big">${f(d.devPct,1)}%</b> of supply</div></div>
      ${steps?`<ul class="steps">${steps}</ul>`:'<div class="hint" style="margin-top:10px">No sells added yet.</div>'}
    </div>
    <div class="wallet"><div class="row"><span class="tag">SIDE WALLETS</span><span class="muted" style="font-size:13px">${f(d.clCount,0)} wallets combined</span></div>
      <div class="buy"><div><span>Buy</span><b class="big">${f(d.clSol)}</b> SOL</div><div><span>Get</span><b class="big">${f(d.clPct,1)}%</b> of supply</div><div><span>Out by</span><b class="big">${sec(d.clExit)}</b></div></div>
    </div>
    <div class="total"><span><b>Opening:</b> ${f((d.devBuy||0)+(d.clSol||0))} SOL · ${f((d.devPct||0)+(d.clPct||0),1)}% of supply</span><span class="muted">mcap after ~${fmtK(d.openMcap)}</span></div>
  </div>

  <div class="card"><h2>Strategy</h2>${strategy(d)}</div>`;
}

function modal(html){const m=document.createElement('div');m.className='modalbg';m.id='modal';m.innerHTML=`<div class="modal">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove()}
function sellRow(s={}){return `<div class="fields sellrow" style="grid-template-columns:1fr 1fr auto;margin-bottom:8px">
  <div><input type="number" step="any" placeholder="Seconds after launch" class="s-sec" value="${esc(s.sec??'')}"></div>
  <div><input type="number" step="any" placeholder="% of supply sold" class="s-pct" value="${esc(s.pct??'')}"></div>
  <div><button class="btn sm del" onclick="this.closest('.sellrow').remove()">✕</button></div></div>`}
function editDev(id){
  const d=id?getDev(id):{sells:[]};
  const F=(k,lab,v,t='number')=>`<div><label>${lab}</label><input id="f-${k}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(v??'')}"></div>`;
  modal(`<h2>${id?'Edit dev':'Add dev'}</h2>
  <div class="fields">${F('name','Name',d.name,'text')}${F('wallet','Dev wallet',d.wallet,'text')}${F('open','Mcap after opening ($)',d.openMcap)}
  ${F('devBuy','Dev buy (SOL)',d.devBuy)}${F('devPct','Dev % of supply',d.devPct)}<div></div>
  ${F('cc','Side wallets (count)',d.clCount)}${F('cs','Side wallets SOL (total)',d.clSol)}${F('cp','Side wallets % (total)',d.clPct)}
  ${F('cexit','Side wallets out by (secs)',d.clExit)}</div>
  <h2 style="margin-top:18px">Dev sells, in order</h2><div id="sells">${(d.sells||[]).map(sellRow).join('')}</div>
  <button class="btn sm" onclick="document.getElementById('sells').insertAdjacentHTML('beforeend',sellRow())">+ Add sell</button>
  <div style="margin-top:14px"><label>Strategy notes (one per line, each becomes a bullet)</label><textarea id="f-notes">${esc(d.notes)}</textarea></div>
  <div class="row between" style="margin-top:16px">${id?`<button class="btn del" onclick="delDev('${id}')">Delete dev</button>`:'<span></span>'}
  <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveDev('${id||''}')">Save</button></div></div>`);
}
function saveDev(id){
  const name=val('f-name').trim();if(!name){toast('Name needed');return}
  const sells=[...document.querySelectorAll('#sells .sellrow')].map(r=>({sec:num(r.querySelector('.s-sec').value),pct:num(r.querySelector('.s-pct').value)})).filter(s=>isNum(s.sec)||isNum(s.pct));
  const o={name,wallet:val('f-wallet').trim(),openMcap:num(val('f-open')),devBuy:num(val('f-devBuy')),devPct:num(val('f-devPct')),
    clCount:num(val('f-cc')),clSol:num(val('f-cs')),clPct:num(val('f-cp')),clExit:num(val('f-cexit')),sells,notes:val('f-notes')};
  if(id)Object.assign(getDev(id),o);else{id=uid();DB.devs.push({id,...o})}
  save();closeModal();location.hash='#/dev/'+id;render();
}
function delDev(id){if(!confirm('Delete this dev?'))return;DB.devs=DB.devs.filter(d=>d.id!==id);save();closeModal();location.hash='#/';render()}

function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fallback(t))}else fallback(t)}
function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy failed')}a.remove()}
function backupView(){return `<div class="card"><h2>Backup</h2><p class="hint">Everything saves in this browser. Copy a backup now and then.</p>
  <button class="btn pri" onclick="copyText(JSON.stringify(DB))">Copy backup</button>
  <div style="margin-top:16px"><label>Paste a backup to restore</label><textarea id="restore"></textarea></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="restore()">Restore</button><button class="btn del" onclick="resetAll()">Reset to starter data</button></div></div>`}
function restore(){try{const o=JSON.parse(val('restore'));if(!o||!Array.isArray(o.devs))throw 0;DB=o;save();toast('Restored');location.hash='#/';render()}catch(e){toast("That backup didn't read")}}
function resetAll(){if(!confirm('Replace everything with the starter data?'))return;DB=seed();save();location.hash='#/';render()}

render();
</script>
</body>
</html>
