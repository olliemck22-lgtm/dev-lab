<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161616;--canvas:#1c1c1c;--box:#232323;--line:#3a3a3a;--wire:#5c5c5c;--text:#e8e8e8;--muted:#8b8b8b;--red:#ef5a5a;--keybg:#2a1818;--keyline:#7a2e2e;--link:#6aa7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:600 16px 'IBM Plex Mono',monospace;margin:0;letter-spacing:.5px}
.tab{font:500 12px 'IBM Plex Mono',monospace;padding:6px 12px;border:1px solid var(--line);border-radius:4px;color:var(--muted);text-decoration:none;margin-left:6px}
.tab.on{color:var(--text);border-color:#666}
a{color:var(--link);text-decoration:none}
.btn{font:500 12px 'IBM Plex Mono',monospace;padding:7px 12px;border-radius:4px;border:1px solid var(--line);background:var(--box);color:var(--text);cursor:pointer}
.btn:hover{border-color:#666}.btn.del{color:var(--red);border-color:#5a2a2a}.btn.sm{padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--muted)}
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.title h2{font:600 22px Inter,sans-serif;margin:2px 0 0}
.board{position:relative;background:var(--canvas) radial-gradient(#2a2a2a 1px,transparent 1px) 0 0/22px 22px;border:1px solid #262626;border-radius:6px;overflow:auto;cursor:grab;height:560px}
.board.drag{cursor:grabbing}
.canvas{position:relative}
svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
svg.wires path{fill:none;stroke:var(--wire);stroke-width:1.2}
.node{position:absolute;width:176px}
.fig{font:500 11px 'IBM Plex Mono',monospace;color:var(--muted);margin:0 0 5px 2px;white-space:nowrap}
.fig:before{content:'◎ ';color:#666}
.box{background:var(--box);border:1px solid var(--line);border-radius:4px;padding:12px}
.box.key{background:var(--keybg);border-color:var(--keyline)}
.box.ghost{background:transparent;border-style:dashed}
.box .sm{font-size:11px;color:var(--muted)}
.box .big{font:600 22px 'IBM Plex Mono',monospace;margin:4px 0 0;letter-spacing:-.5px}
.box .big.neg{color:var(--red)}
.box .sub{font:500 12px 'IBM Plex Mono',monospace;color:#cfcfcf}
.meter{height:4px;background:#111;border-radius:2px;margin:9px 0 5px;overflow:hidden}
.meter i{display:block;height:100%;background:#d9d9d9}
.lbl{position:absolute;transform:translate(-50%,-50%);font:500 11px 'IBM Plex Mono',monospace;color:#bdbdbd;background:var(--canvas);padding:1px 6px;white-space:nowrap}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:22px}
.notes .box{font-size:13px;min-height:72px}
.hint{font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);margin-top:8px}
.devcard{display:block;color:inherit;margin-bottom:14px}
.devcard .box{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.devcard:hover .box{border-color:#666}
input,textarea{font:13px 'IBM Plex Mono',monospace;background:#151515;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:Inter,sans-serif}
label{font:500 11px 'IBM Plex Mono',monospace;color:var(--muted);display:block;margin-bottom:4px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.fields{grid-template-columns:1fr 1fr}.board{height:520px}}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal{background:#1e1e1e;border:1px solid var(--line);border-radius:6px;padding:18px;width:100%;max-width:640px}
.modal h3{font:600 12px 'IBM Plex Mono',monospace;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:.6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e8e8e8;color:#111;padding:8px 14px;border-radius:4px;font:600 12px 'IBM Plex Mono',monospace;z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>DEV LAB</h1><nav id="tabs"></nav></div>
  <div id="app"></div>
</div>
<script>
const KEY='devlab.v3';
const uid=()=>Math.random().toString(36).slice(2,10);
const isNum=n=>typeof n==='number'&&isFinite(n);
const num=v=>(v===''||v==null)?null:(isFinite(Number(v))?Number(v):null);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(n,d=2)=>isNum(n)?n.toFixed(d):'—';
const sec=n=>isNum(n)?Math.round(n)+'s':'?s';
function fmtK(n){if(!isNum(n))return '—';if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return '$'+(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return '$'+Math.round(n)}

function seed(){
  return {devs:[{id:uid(),name:'petal',wallet:'4HXb7…vEpU',
    devBuy:5.00,devPct:15.3,sells:[{sec:null,pct:5.0},{sec:null,pct:3.4}],
    clCount:5,clSol:8.90,clPct:18.6,clExit:null,openMcap:6200,
    notes:'Dev wallet is the earner: 93% win rate, green every day in October\nSide wallets are close to a coin flip (~43–49% win rate), red every day since Oct 9 apart from one\nAbout 30 launches a day, mostly pet and animal names (some Chinese)\nNo one holds for runners: everything is sold in the first wave'}]};
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Could not save in this browser')}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const getDev=id=>DB.devs.find(d=>d.id===id);
const val=id=>document.getElementById(id).value;

/* ---------- board ---------- */
let LINKS=[];
function board(d){
  const N=[];LINKS=[];
  const st=d.sells||[];
  const n=(id,x,y,fig,html,cls='')=>N.push(`<div class="node" id="n-${id}" style="left:${x}px;top:${y}px"><div class="fig">${fig}</div><div class="box ${cls}">${html}</div></div>`);
  const L=(a,b,label,mode='h')=>LINKS.push({a,b,label,mode});

  n('dev',30,60,'Block 0 · Dev wallet',`<div class="sm mono">${esc(d.wallet)||'—'}</div><div class="big">${f(d.devBuy)} SOL</div><div class="sub">${f(d.devPct,1)}% of supply</div>`,'key');
  const hasSide=isNum(d.clSol);
  if(hasSide){
    n('side',30,330,'Block 0 · Side wallets',`<div class="sm">${f(d.clCount,0)} wallets combined</div><div class="big">${f(d.clSol)} SOL</div><div class="sub">${f(d.clPct,1)}% of supply</div>`);
    L('dev','side','same block','v');
  }
  n('open',260,195,'After opening',`<div class="sm">Total in</div><div class="big">${f((d.devBuy||0)+(d.clSol||0))} SOL</div><div class="sub">${f((d.devPct||0)+(d.clPct||0),1)}% of supply</div><div class="sm" style="margin-top:6px">mcap ~${fmtK(d.openMcap)}</div>`);
  L('dev','open','buy');if(hasSide)L('side','open','buy');

  let hold=d.devPct,prev='open',x=490;
  st.forEach((s,i)=>{
    hold=isNum(hold)?Math.max(0,hold-(s.pct||0)):null;
    const w=isNum(hold)&&d.devPct?hold/d.devPct*100:0;
    n('s'+i,x,i%2?260:90,`Dev sell ${i+1}`,`<div class="sm">at ${sec(s.sec)}</div><div class="big neg">−${f(s.pct,1)}%</div><div class="sub">of supply</div><div class="meter"><i style="width:${w}%"></i></div><div class="sm">holding ${f(hold,1)}%</div>`);
    L(prev,'s'+i,'+'+sec(s.sec));prev='s'+i;x+=210;
  });
  const out=isNum(hold)&&hold<=0.3;
  n('end',x,175,out?'Dev fully out':'Rest of dev bag',out?`<div class="big">0%</div><div class="sub">all sold by ${sec(st.length?st[st.length-1].sec:null)}</div>`:`<div class="big">${f(hold,1)}%</div><div class="sub">still holding</div><div class="sm" style="margin-top:6px">add the remaining sells</div>`,out?'':'ghost');
  L(prev,'end',out?'done':'?');
  if(hasSide){n('sx',x,420,'Side wallets out',`<div class="big">${sec(d.clExit)}</div><div class="sub">all side wallets sold</div>`,isNum(d.clExit)?'':'ghost');L('side','sx','sell into the wave')}
  return {html:N.join(''),w:x+200,h:560};
}
function drawLinks(){
  const c=document.getElementById('canvas');if(!c)return;
  const svg=c.querySelector('svg');const pos=id=>{const e=document.getElementById('n-'+id);const b=e.querySelector('.box');return {x:e.offsetLeft,y:e.offsetTop+b.offsetTop,w:e.offsetWidth,h:b.offsetHeight}};
  c.querySelectorAll('.lbl').forEach(e=>e.remove());
  let p='';
  LINKS.forEach(l=>{
    const a=pos(l.a),b=pos(l.b);let x1,y1,x2,y2,d,mx,my;
    if(l.mode==='v'){x1=a.x+a.w/2;y1=a.y+a.h;x2=b.x+b.w/2;y2=b.y-22;const k=(y2-y1)/2;d=`M${x1},${y1} C${x1},${y1+k} ${x2},${y2-k} ${x2},${y2}`;mx=(x1+x2)/2;my=(y1+y2)/2}
    else{x1=a.x+a.w;y1=a.y+a.h/2;x2=b.x;y2=b.y+b.h/2;const k=Math.max(40,(x2-x1)/2);d=`M${x1},${y1} C${x1+k},${y1} ${x2-k},${y2} ${x2},${y2}`;mx=(x1+x2)/2;my=(y1+y2)/2}
    p+=`<path d="${d}"/><circle cx="${x2}" cy="${y2}" r="2.5" fill="#8b8b8b"/>`;
    if(l.label){const t=document.createElement('div');t.className='lbl';t.style.left=mx+'px';t.style.top=my+'px';t.textContent=l.label;c.appendChild(t)}
  });
  svg.innerHTML=p;
}
function enablePan(){
  const b=document.querySelector('.board');if(!b)return;let down=false,sx,sy,sl,stp;
  b.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;b.classList.add('drag');sx=e.clientX;sy=e.clientY;sl=b.scrollLeft;stp=b.scrollTop});
  window.addEventListener('pointermove',e=>{if(!down)return;b.scrollLeft=sl-(e.clientX-sx);b.scrollTop=stp-(e.clientY-sy)});
  window.addEventListener('pointerup',()=>{down=false;b.classList.remove('drag')});
}

/* ---------- views ---------- */
function nav(){
  const h=location.hash||'#/';
  document.getElementById('tabs').innerHTML=[['#/','Devs'],['#/backup','Backup']].map(([k,v])=>`<a class="tab ${(h===k||(k==='#/'&&h.startsWith('#/dev/')))?'on':''}" href="${k}">${v}</a>`).join('');
}
function render(){
  nav();const h=location.hash||'#/';const app=document.getElementById('app');
  if(h.startsWith('#/dev/')){const d=getDev(h.slice(6));if(!d){location.hash='#/';return}app.innerHTML=devView(d);drawLinks();enablePan();if(document.fonts)document.fonts.ready.then(drawLinks);return}
  if(h==='#/backup'){app.innerHTML=backupView();return}
  app.innerHTML=homeView();
}
window.addEventListener('hashchange',render);
window.addEventListener('resize',drawLinks);

function homeView(){
  return `<div class="row between" style="margin-bottom:16px"><span class="muted mono" style="font-size:12px">${DB.devs.length} dev${DB.devs.length===1?'':'s'} tracked</span><button class="btn" onclick="editDev()">+ Add dev</button></div>`+
  (DB.devs.map(d=>`<a class="devcard" href="#/dev/${d.id}"><div class="fig">${esc(d.wallet)||'no wallet'}</div><div class="box">
    <div><div class="sm">Dev</div><div style="font:600 18px Inter">${esc(d.name)}</div></div>
    <div><div class="sm">Dev buy</div><div class="sub">${f(d.devBuy)} SOL · ${f(d.devPct,1)}%</div></div>
    <div><div class="sm">Side wallets</div><div class="sub">${f(d.clSol)} SOL · ${f(d.clPct,1)}%</div></div>
    <div><div class="sm">Dev sells</div><div class="sub">${(d.sells||[]).length}</div></div></div></a>`).join('')||'<div class="box muted">No devs yet.</div>');
}

function devView(d){
  const b=board(d);
  const notes=(d.notes||'').split('\n').map(x=>x.trim()).filter(Boolean);
  return `<div class="title"><div><a href="#/" class="mono" style="font-size:12px">← all devs</a><h2>${esc(d.name)}</h2></div><button class="btn" onclick="editDev('${d.id}')">Edit</button></div>
  <div class="board"><div class="canvas" id="canvas" style="width:${b.w}px;height:${b.h}px"><svg class="wires" width="${b.w}" height="${b.h}"></svg>${b.html}</div></div>
  <div class="hint">Drag to move around · times are seconds after launch · % is of total supply</div>
  ${notes.length?`<div class="notes">${notes.map((t,i)=>`<div><div class="fig">Note ${String(i+1).padStart(2,'0')}</div><div class="box">${esc(t)}</div></div>`).join('')}</div>`:''}`;
}

/* ---------- edit ---------- */
function modal(html){const m=document.createElement('div');m.className='modalbg';m.id='modal';m.innerHTML=`<div class="modal">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove()}
function sellRow(s={}){return `<div class="fields sellrow" style="grid-template-columns:1fr 1fr auto;margin-bottom:8px">
  <div><input type="number" step="any" placeholder="Seconds after launch" class="s-sec" value="${esc(s.sec??'')}"></div>
  <div><input type="number" step="any" placeholder="% of supply sold" class="s-pct" value="${esc(s.pct??'')}"></div>
  <div><button class="btn sm del" onclick="this.closest('.sellrow').remove()">✕</button></div></div>`}
function editDev(id){
  const d=id?getDev(id):{sells:[]};
  const F=(k,lab,v,t='number')=>`<div><label>${lab}</label><input id="f-${k}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(v??'')}"></div>`;
  modal(`<h3>${id?'Edit dev':'Add dev'}</h3>
  <div class="fields">${F('name','Name',d.name,'text')}${F('wallet','Dev wallet',d.wallet,'text')}${F('open','Mcap after opening ($)',d.openMcap)}
  ${F('devBuy','Dev buy (SOL)',d.devBuy)}${F('devPct','Dev % of supply',d.devPct)}<div></div>
  ${F('cc','Side wallets (count)',d.clCount)}${F('cs','Side wallets SOL (total)',d.clSol)}${F('cp','Side wallets % (total)',d.clPct)}
  ${F('cexit','Side wallets out by (secs)',d.clExit)}</div>
  <h3 style="margin-top:18px">Dev sells, in order</h3><div id="sells">${(d.sells||[]).map(sellRow).join('')}</div>
  <button class="btn sm" onclick="document.getElementById('sells').insertAdjacentHTML('beforeend',sellRow())">+ Add sell</button>
  <div style="margin-top:14px"><label>Notes (one per line, each becomes a card)</label><textarea id="f-notes">${esc(d.notes)}</textarea></div>
  <div class="row between" style="margin-top:16px">${id?`<button class="btn del" onclick="delDev('${id}')">Delete dev</button>`:'<span></span>'}
  <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" style="border-color:#888" onclick="saveDev('${id||''}')">Save</button></div></div>`);
}
function saveDev(id){
  const name=val('f-name').trim();if(!name){toast('Name needed');return}
  const sells=[...document.querySelectorAll('#sells .sellrow')].map(r=>({sec:num(r.querySelector('.s-sec').value),pct:num(r.querySelector('.s-pct').value)})).filter(s=>isNum(s.sec)||isNum(s.pct));
  const o={name,wallet:val('f-wallet').trim(),openMcap:num(val('f-open')),devBuy:num(val('f-devBuy')),devPct:num(val('f-devPct')),
    clCount:num(val('f-cc')),clSol:num(val('f-cs')),clPct:num(val('f-cp')),clExit:num(val('f-cexit')),sells,notes:val('f-notes')};
  if(id)Object.assign(getDev(id),o);else{id=uid();DB.devs.push({id,...o})}
  save();closeModal();location.hash='#/dev/'+id;render();
}
function delDev(id){if(!confirm('Delete this dev?'))return;DB.devs=DB.devs.filter(d=>d.id!==id);save();closeModal();location.hash='#/';render()}

/* ---------- backup ---------- */
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fallback(t))}else fallback(t)}
function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy failed')}a.remove()}
function backupView(){return `<div class="fig">Backup</div><div class="box"><div class="hint" style="margin:0 0 12px">Everything saves in this browser. Copy a backup now and then.</div>
  <button class="btn" onclick="copyText(JSON.stringify(DB))">Copy backup</button>
  <div style="margin-top:16px"><label>Paste a backup to restore</label><textarea id="restore"></textarea></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="restore()">Restore</button><button class="btn del" onclick="resetAll()">Reset to starter data</button></div></div>`}
function restore(){try{const o=JSON.parse(val('restore'));if(!o||!Array.isArray(o.devs))throw 0;DB=o;save();toast('Restored');location.hash='#/';render()}catch(e){toast("That backup didn't read")}}
function resetAll(){if(!confirm('Replace everything with the starter data?'))return;DB=seed();save();location.hash='#/';render()}

render();
</script>
</body>
</html>
